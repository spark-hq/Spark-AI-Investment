<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark Investment - Price Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .login-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .test-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-bottom: 15px;
            color: #1f2937;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Spark Investment</h1>
            <p>Price Update Service Test Dashboard</p>
        </div>

        <!-- Login -->
        <div class="login-box">
            <h2>🔐 Login First</h2>
            <input type="email" id="email" placeholder="Email" value="tejas@sparkinvest.com">
            <input type="password" id="password" placeholder="Password" value="Test@1234">
            <button id="loginBtn">Login</button>
            <div id="loginResult" class="result" style="display:none;"></div>
        </div>

        <!-- Tests -->
        <div class="test-box" id="testsSection" style="display:none;">
            <h2>📊 Price Update Tests</h2>
            
            <div class="grid">
                <!-- Stock Price -->
                <div class="card">
                    <h3>📈 Stock Price</h3>
                    <input type="text" id="stockSymbol" placeholder="Symbol (e.g., RELIANCE)" value="RELIANCE">
                    <button id="stockBtn">Get Stock Price</button>
                    <div id="stockResult" class="result" style="display:none;"></div>
                </div>

                <!-- Crypto Price -->
                <div class="card">
                    <h3>₿ Crypto Price</h3>
                    <input type="text" id="cryptoSymbol" placeholder="Symbol (e.g., BTC)" value="BTC">
                    <button id="cryptoBtn">Get Crypto Price</button>
                    <div id="cryptoResult" class="result" style="display:none;"></div>
                </div>

                <!-- Update All Prices -->
                <div class="card">
                    <h3>🔄 Update All Prices</h3>
                    <button id="updateBtn">Update All Investment Prices</button>
                    <div id="updateResult" class="result" style="display:none;"></div>
                </div>

                <!-- Price Status -->
                <div class="card">
                    <h3>📊 Update Status</h3>
                    <button id="statusBtn">Get Price Update Status</button>
                    <div id="statusResult" class="result" style="display:none;"></div>
                </div>
            </div>

            <!-- Portfolio Summary -->
            <div class="card" style="margin-top: 20px;">
                <h3>💼 Portfolio Summary</h3>
                <button id="portfolioBtn">Get Updated Portfolio</button>
                <div id="portfolioResult" class="result" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let token = '';

        // Event Listeners
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('stockBtn').addEventListener('click', getStockPrice);
        document.getElementById('cryptoBtn').addEventListener('click', getCryptoPrice);
        document.getElementById('updateBtn').addEventListener('click', updateAllPrices);
        document.getElementById('statusBtn').addEventListener('click', getPriceStatus);
        document.getElementById('portfolioBtn').addEventListener('click', getPortfolio);

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.data.token;
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Login Successful!\nToken: ' + token.substring(0, 50) + '...';
                    document.getElementById('testsSection').style.display = 'block';
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Login Failed: ' + error.message;
            }
        }

        async function getStockPrice() {
            const symbol = document.getElementById('stockSymbol').value;
            const resultDiv = document.getElementById('stockResult');
            
            try {
                const response = await fetch(API_BASE + '/prices/' + symbol + '?type=stock&exchange=NSE', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const price = data.data.price;
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ ' + symbol + '\nPrice: ₹' + price.price + '\nExchange: ' + price.exchange + '\nSource: ' + price.source + '\nTime: ' + new Date(price.timestamp).toLocaleString();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Error: ' + error.message;
            }
        }

        async function getCryptoPrice() {
            const symbol = document.getElementById('cryptoSymbol').value;
            const resultDiv = document.getElementById('cryptoResult');
            
            try {
                const response = await fetch(API_BASE + '/prices/' + symbol + '?type=crypto', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const price = data.data.price;
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ ' + symbol + '\nPrice: ₹' + price.price.toLocaleString() + '\nUSD: $' + price.priceUSD.toLocaleString() + '\n24h Change: ' + price.change24h.toFixed(2) + '%\nSource: ' + price.source;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Error: ' + error.message;
            }
        }

        async function updateAllPrices() {
            const resultDiv = document.getElementById('updateResult');
            resultDiv.style.display = 'block';
            resultDiv.textContent = '⏳ Updating prices...';
            
            try {
                const response = await fetch(API_BASE + '/prices/update', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const summary = data.data.summary;
                    let details = '✅ Price Update Complete!\n\nTotal: ' + summary.total + '\nUpdated: ' + summary.updated + '\nFailed: ' + summary.failed + '\nSkipped: ' + summary.skipped + '\n';
                    
                    if (data.data.details && data.data.details.length > 0) {
                        details += '\nUpdated Prices:\n';
                        data.data.details.forEach(function(d) {
                            const change = ((d.newPrice - d.oldPrice) / d.oldPrice * 100).toFixed(2);
                            details += d.symbol + ': ₹' + d.oldPrice + ' → ₹' + d.newPrice + ' (' + change + '%)\n';
                        });
                    }
                    
                    resultDiv.className = 'result success';
                    resultDiv.textContent = details;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Error: ' + error.message;
            }
        }

        async function getPriceStatus() {
            const resultDiv = document.getElementById('statusResult');
            
            try {
                const response = await fetch(API_BASE + '/prices/status', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    let text = '✅ Price Update Status\n\nPortfolio Last Updated:\n' + new Date(data.data.portfolioLastUpdated).toLocaleString() + '\n\nRecent Updates:\n';
                    
                    data.data.recentUpdates.forEach(function(inv) {
                        text += inv.symbol + ' (' + inv.type + '): ₹' + inv.currentPrice + '\nUpdated: ' + new Date(inv.updatedAt).toLocaleString() + '\n\n';
                    });
                    
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = text;
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Error: ' + error.message;
            }
        }

        async function getPortfolio() {
            const resultDiv = document.getElementById('portfolioResult');
            
            try {
                const response = await fetch(API_BASE + '/portfolio/summary', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const p = data.data;
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ Portfolio Summary\n\nTotal Invested: ₹' + p.totalInvested.toLocaleString() + '\nCurrent Value: ₹' + p.currentValue.toLocaleString() + '\nTotal Returns: ₹' + p.totalReturns.toLocaleString() + ' (' + p.returnsPercentage.toFixed(2) + '%)\n\nAsset Allocation:\nEquity: ' + p.assetAllocation.equity + '%\nDebt: ' + p.assetAllocation.debt + '%\nGold: ' + p.assetAllocation.gold + '%\nCrypto: ' + p.assetAllocation.crypto + '%\n\nLast Updated: ' + new Date(p.lastUpdated).toLocaleString();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
