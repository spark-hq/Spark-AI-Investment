version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: spark-postgres
    restart: always
    environment:
      POSTGRES_USER: spark_admin
      POSTGRES_PASSWORD: spark_password_2024
      POSTGRES_DB: spark_investment
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark_admin -d spark_investment"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spark-redis
    restart: always
    command: redis-server --requirepass redis_password_2024 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - ./redis-data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spark-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sparkinvestment.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5051:80"
    depends_on:
      - postgres

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: spark-redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:spark-redis:6379:0:redis_password_2024
    ports:
      - "8081:8081"
    depends_on:
      - redis

